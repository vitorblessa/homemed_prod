name: CI

# A cada envio ao GitHub (e a cada pull request): roda os testes e confere que o
# site compila. Assim um erro aparece aqui, e não depois do deploy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Testes
        run: yarn test

      - name: Compilar o site
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Avisa (sem barrar o envio) quando uma dependência de produção ganha alerta de segurança.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditoria das dependências de produção
        run: yarn audit --groups dependencies --level high
