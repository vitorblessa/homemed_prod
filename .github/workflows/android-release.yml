name: Android Release Build

# Builds a signed .aab (Android App Bundle) ready for upload to Google Play.
# Runs on GitHub's own runners because they already have the Android SDK
# installed — the app itself only needs a thin Capacitor shell, since it
# loads the live site (https://www.homemed.tech) at runtime.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .keystore file
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (e.g. "homemed")
#   ANDROID_KEY_PASSWORD      key password

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install platform/build-tools
        # ubuntu-latest runners already ship an Android SDK; we just need to
        # accept its licenses (non-interactively, hence "yes |") and install
        # the specific platform/build-tools this project targets.
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: yarn install

      - name: Prepare placeholder web assets
        # Capacitor requires webDir to exist, but the app actually loads the
        # live site remotely (see capacitor.config.js server.url), so this
        # only needs to be non-empty.
        run: |
          mkdir -p out
          echo '<!doctype html><title>HomeMed</title>' > out/index.html

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/homemed-release.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=homemed-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release .aab
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: homemed-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
