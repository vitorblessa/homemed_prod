name: Database Backup

# Backup diário do MongoDB Atlas (plano gratuito não tem backup automático).
# O dump é criptografado e guardado como artifact do GitHub (fora do Atlas) por 90 dias.
# Secrets necessários: MONGO_URL e BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: '17 6 * * *' # todo dia às 03:17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Instalar MongoDB Database Tools
        run: |
          curl -fsSL -o tools.deb https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo apt-get install -y ./tools.deb
          mongodump --version

      - name: Gerar dump
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          set -euo pipefail
          if [ -z "${MONGO_URL:-}" ]; then echo "Secret MONGO_URL não configurado"; exit 1; fi
          pip install --quiet "pymongo[srv]"
          # Descobre os bancos do cluster (menos os de sistema): o nome do banco não importa.
          python3 - > dbs.txt <<'PY'
          import os
          from pymongo import MongoClient
          names = MongoClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=20000).list_database_names()
          print("\n".join(n for n in names if n not in ("admin", "local", "config")))
          PY
          echo "Bancos encontrados:"; cat dbs.txt
          if [ ! -s dbs.txt ]; then
            echo "::error::Nenhum banco encontrado no cluster. Confira se o secret MONGO_URL é o mesmo usado na Vercel."
            exit 1
          fi
          mkdir dumps
          while read -r DB; do
            echo "--- Copiando banco: $DB"
            mongodump --uri="$MONGO_URL" --db="$DB" --gzip --archive="dumps/$DB.archive.gz" 2>&1 | tee -a dump.log
          done < dbs.txt
          tar -cf dump.tar dumps
          SIZE=$(stat -c%s dump.tar)
          echo "Tamanho do backup: $SIZE bytes"
          echo "Coleções copiadas:"; grep -o "done dumping [^ ]*" dump.log | sort || true
          if ! grep -q "done dumping" dump.log; then
            echo "::error::Os bancos estão vazios, nada foi copiado."
            exit 1
          fi

      - name: Criptografar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then echo "Secret BACKUP_PASSPHRASE não configurado"; exit 1; fi
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            -o "homemed-backup-$STAMP.tar.gpg" dump.tar
          rm -rf dump.tar dumps
          ls -l homemed-backup-*.gpg

      - name: Guardar backup
        uses: actions/upload-artifact@v4
        with:
          name: homemed-db-backup
          path: homemed-backup-*.gpg
          retention-days: 90
          if-no-files-found: error
